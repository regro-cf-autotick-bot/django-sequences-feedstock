{% set name = "django-sequences" %}
{% set version = "3.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 6408874a1399fb1ccc42abb4ebc84bfeb8be45e5023fbdc2d5f1124586622d15

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python >=3.6.2
    - poetry
  run:
    - django >=3.2
    - python >=3.6.2

test:
  imports:
    - sequences
    - sequences.migrations
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/aaugustin/django-sequences
  summary: Generate gapless sequences of integer values.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MichelML
